<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celebración del primer mes</title>
<meta name="description" content="Celebración del primer mes">
<meta property="og:title" content="Celebración del primer mes">
<meta property="og:description" content="Celebración del primer mes">
<meta property="og:type" content="website">
<meta name="theme-color" content="#fff6f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell">
<header class="page-header">
<p class="eyebrow"><span class="brand-mark" aria-hidden="true">♥</span> Un detalle para Kate</p>
</header>
<p class="counter" id="counter" role="status" aria-live="polite"></p>
<section class="panel" id="panel" aria-label="Juego"></section>
<footer class="page-footer">Hecho con cariño, para guardar y volver a jugar.</footer>
</main>
<script>
// ===== EDITA AQUÍ: preguntas y carta =====
var START = new Date(2026,9,29);   // 29 de octubre 2026 (primer mes)
var MET = new Date(2026,6,20);     // 20 de julio 2026 (se conocieron en persona)
var QS = [
 {q:"¿Qué día nos vimos por primera vez en persona?",o:[
  {t:"20 de julio",ok:1,c:"Ese día hablamos tanto que el tiempo se nos fue volando."},
  {t:"29 de octubre",c:"Ese día fue la llamada. Casi, pero no."},
  {t:"Un día que ya se me olvidó",c:"Te vi la cara: sí te acuerdas."}]},
 {q:"¿Qué fue lo primero que hiciste cuando nos vimos en persona?",o:[
  {t:"Me abrazaste y me diste un beso en la mejilla",ok:1,c:"Un abrazo y un beso en la mejilla. Así empezó todo en persona."},
  {t:"Me diste la mano",c:"Muy formal, y no fue así."},
  {t:"Me hiciste un choque de puños",c:"Habría sido gracioso, pero no."}]},
 {q:"¿A qué película fuimos en lo que fue, técnicamente, nuestra primera cita?",o:[
  {t:"La Odisea",ok:1,c:"La Odisea. Nuestra primera cita, técnicamente."},
  {t:"Boulevard",c:"Esa es tu obsesión, no nuestra primera cita."},
  {t:"Titanic",c:"Esa nos la debemos."}]},
 {q:"¿Cómo empezó lo nuestro?",o:[
  {t:"Una amistad a distancia que fue creciendo",ok:1,c:"Así fue. Sin darme cuenta, me tenías más cerca de lo que pensaba."},
  {t:"Amor a primera vista",c:"Fue mejor: lento y de verdad."},
  {t:"Un malentendido que salió bien",c:"Habría sido un buen guion, pero no."}]},
 {q:"¿Qué hacíamos cuando estábamos lejos?",o:[
  {t:"Ver series, animes y películas",ok:1,c:"Sí. Y todavía nos quedan muchas por ver, por algo tenemos un Excel con la lista."},
  {t:"Jugar videojuegos toda la noche",c:"Tú no eres gamer, no me engañas."},
  {t:"Mandarnos cartas",c:"Muy romántico, pero ganó la pantalla."}]},
 {q:"¿Qué pasó el 29 de octubre?",o:[
  {t:"Me llamaste por teléfono",ok:1,c:"Esa llamada. Todavía me acuerdo."},
  {t:"Nos vimos en persona",c:"Eso fue antes, el 20 de julio."},
  {t:"Me mandaste un mensaje",c:"Un mensaje habría sido más fácil, pero llamaste, y eso lo hace especial."}]},
 {q:"¿Cuál es nuestra canción?",o:[
  {t:"Boulevard of Broken Dreams",ok:1,c:"Y todo porque te obsesionaste con la película Boulevard. Nunca la voy a escuchar igual."},
  {t:"Wake Me Up When September Ends",c:"También de Green Day, pero no es la nuestra."},
  {t:"Basket Case",c:"Qué buena, pero no es la nuestra."}]},
 {q:"¿Qué podrías tejerme algún día?",o:[
  {t:"Una bufanda para el frío",ok:1,c:"Anotado. Te la voy a cobrar."},
  {t:"Un gorro con orejas",ok:1,c:"Con orejas. Ya me lo imagino."},
  {t:"Lo que yo te pida",ok:1,c:"Cuidado, que puedo pedir mucho."}]},
 {q:"¿Qué fruta soy para ti?",o:[
  {t:"Tomatito",ok:1,c:"Tomatito. Y sí, es una fruta. No hay discusión."},
  {t:"Frutillita",c:"También es una fruta, pero no me dices así."},
  {t:"Platanito",c:"Fruta también, pero el tuyo es otro."}]},
 {q:"¿Quién habla más cuando conversamos?",o:[
  {t:"Kate",ok:1,c:"Kate abre el tema, y entre una cosa y otra pasan dos horas. Me encanta."},
  {t:"Katie",ok:1,c:"Katie tiene tres cosas más que contar, y todas son entretenidas."},
  {t:"Rose",ok:1,c:"Rose dice “una cosa más” y son las 2 de la mañana."},
  {t:"Christopher",ok:1,c:"Buen intento. Pero me gusta escucharte, así que lo dejamos pasar."}]},
 {q:"¿Quién gana la competencia de beber que nunca declaramos?",o:[
  {t:"tu",ok:1,c:"La competencia que nunca declaramos, y que siempre gano yo, en especial si hay destilados."},
  {t:"yo",c:"Qué generosa eres. Pero no."},
  {t:"Empate",c:"Eso lo dices para que no se enoje nadie."}]},
 {q:"¿Qué color nos representa a cada uno en nuestras pulseras?",o:[
  {t:"El rojo para ti y el morado para mí",ok:1,c:"Rojo por las rosas que tanto te gustan, y morado porque me representa a mí."},
  {t:"El morado para ti y el rojo para mí",c:"Al revés. Piénsalo con las rosas."},
  {t:"Verde para ti y amarillo para mí",c:"Muy original, pero no. Las hice yo y me acuerdo."}]},
 {q:"¿Qué color de labial me gusta más en ti?",o:[
  {t:"Rojo",ok:1,c:"Rojo. Te queda perfecto."},
  {t:"Rosado",c:"Lindo, pero gana el rojo."},
  {t:"Negro",c:"Igual me gustaría verte con estilo gótico algún día. Pero gana el rojo."}]},
 {q:"¿Qué anime nos toca ver después?",o:[
  {t:"Madoka Magica",ok:1,c:"Madoka Magica. Hace rato quiero mostrártela."},
  {t:"Re:Zero",ok:1,c:"Re:Zero, mi isekai favorito. Gracias por darle una oportunidad."},
  {t:"Inuyasha",ok:1,c:"Inuyasha, tu favorito. Es el trato: primero lo mío y después lo tuyo."}]},
 {q:"¿Volverías a bailar conmigo?",o:[
  {t:"Sí, aunque sea otro intento de vals",ok:1,c:"Me alegra. En la carta te cuento algo."},
  {t:"Sí, pero ahora con los pasos aprendidos",ok:1,c:"Trato hecho. Antes, abre la carta."},
  {t:"Sí, y esta vez yo llevo",ok:1,c:"Eso lo negociamos después. Primero, la carta."}]}
];
var QUESTION_IMAGES = [
 {src:"pregunta-gato-pulgar.jpg",alt:"Un gato blanco levantando la pata en señal de aprobación."},
 {src:"tenor-cat-2.gif",alt:"Un gatito naranja con ojos grandes."},
 {src:"tenor-cat-3.webp",alt:"Un gato bailando."},
 {src:"tenor-cat-4.webp",alt:"Dos gatos riéndose juntos."},
 {src:"tenor-cat-5.webp",alt:"Un gatito haciendo una expresión graciosa."},
 {src:"tenor-cat-6.webp",alt:"Un gatito con un ramo de flores."},
 {src:"tenor-cat-7.gif",alt:"Un gatito iluminado de color rosa."},
 {src:"tenor-cat-8.webp",alt:"Un gatito acompañado de rosas."},
 {src:"tenor-cat-1.gif",alt:"Un gatito naranja mirando a la cámara."},
 {src:"pregunta-gato-lentes.jpg",alt:"Un gatito con lentes de sol."},
 {src:"pregunta-11-gato.gif",alt:"Un gato blanco jugando en el suelo."},
 {src:"pregunta-gato-cejas.jpg",alt:"Un gato blanco con las cejas dibujadas."},
 {src:"pregunta-labial-gato.png",alt:"Un gato blanco con marcas de besos de labial."},
 {src:"pregunta-gato-confundido.jpg",alt:"Un gato gris con expresión confundida."}
];
var LETTER = "Poema para Kate, mi amor (no soy bueno escribiendo estas cosas pero lo intente xd):\n\nMucho antes del veintinueve de octubre\nnuestra historia ya se estaba escribiendo,\na la distancia, entre animes y series,\ncon charlas largas que no tenían tiempo.\nFue una amistad que plantó su semilla\ny que creció sin que lo fuera advirtiendo.\n\nEl veinte de julio rompimos la pantalla,\nhablamos tanto que el reloj se apagó.\nNuestra primera cita, viendo La Odisea,\nabrió el camino para lo que llegó:\nesa llamada tuya, al final de octubre,\ndonde el mundo giró y todo al fin cambió.\n\nTodavía sonrío al recordar la noche\nen que inventamos nuestro propio vals.\nY si algún día me preguntas si repito el baile,\nte diré que sí, mil veces, con o sin compás.\n\nA veces no me dices las cosas con palabras,\npero te siento en tu manera de cuidar,\nen cómo me sostienes y en cómo das espacio,\ngracias por ser tan tú y hacerme carcajear.\n\nHoy es un mes, y la verdad te digo,\nque el corazón me pide mucho más:\nde más capítulos, más platos de cazuela,\ny de esas charlas nuestras, que no terminan jamás.\n\nFeliz primer mes, Rose.\n\nChristopher";
// ===== fin de la zona editable =====

var p = document.getElementById('panel'), i = 0, score = 0;
function days(a,b){return Math.round((b-a)/86400000)}
var t = new Date(), today = new Date(t.getFullYear(),t.getMonth(),t.getDate());
var cEl = document.getElementById('counter');
if(today<START){cEl.textContent="Faltan "+days(today,START)+" días para nuestro primer mes"}
else{cEl.textContent="Llevamos "+days(START,today)+" días juntos"}

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function coverImage(){
 var image=el('img','cover-image');
 image.src='portada-gato.png';
 image.alt='Un gato gris sentado y mirando al frente.';
 return image;
}
function menuGif(){
 var image=el('img','menu-gif');
 image.src='menu-gato.gif';
 image.alt='Gatito acercándose a la cámara.';
 return image;
}
function intro(){
 p.replaceChildren();
 p.appendChild(menuGif());
 p.appendChild(el('h1',null,"¿Qué tal unas preguntas, Kate?"));
 p.appendChild(el('p',null,"la mayoria seran sobre nosotros, asi que espero que hayas estudiado. Mueve la rosa suavemente con las flechas, también en diagonal, y pulsa Enter; en móvil, arrástrala hasta una respuesta."));
 var b=el('button','main',"Empezar");b.onclick=ask;p.appendChild(b);
}
function ask(){
 var Q=QS[i];p.replaceChildren();
 p.appendChild(el('p','prog',"Pregunta "+(i+1)+" de "+QS.length));
 p.appendChild(el('h2',null,Q.q));
 var questionImage=el('img','question-image');
 if(i===QS.length-1){
  questionImage.src='pregunta-15-gatitos.gif';
  questionImage.alt='Dos gatitos juntos.';
 }else{
  questionImage.src=QUESTION_IMAGES[i].src;
  questionImage.alt=QUESTION_IMAGES[i].alt;
 }
 questionImage.loading='lazy';
 p.appendChild(questionImage);
 var box=el('div','box');p.appendChild(box);
 box.appendChild(el('div','tray',"Mueve la rosa suavemente con las flechas (combínalas para ir en diagonal) y pulsa Enter, o arrástrala sobre una respuesta"));
 var m=el('div','marker',"🌹");m.tabIndex=0;m.setAttribute('role','button');m.setAttribute('aria-label','Rosa: muévela con las flechas o arrástrala hasta una respuesta');document.body.appendChild(m);
 var bs=[],done=false,drag=false,x=0,y=0,keys={},frame=0,lastFrame=0;
 function setPosition(left,top){
  x=Math.max(0,Math.min(window.innerWidth-38,left));
  y=Math.max(0,Math.min(window.innerHeight-38,top));
  m.style.left=x+'px';m.style.top=y+'px';
 }
 function hitAnswer(px,py){
  for(var k=0;k<bs.length;k++){
   var r=bs[k].getBoundingClientRect();
   if(px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom)return k;
  }
  return -1;
 }
 function home(){var r=box.getBoundingClientRect();setPosition(r.left+12,r.top+12)}
 function stopMovement(){
  keys={};lastFrame=0;
  if(frame){cancelAnimationFrame(frame);frame=0}
 }
 function animateMovement(time){
  frame=0;
  if(done||drag)return;
  if(!lastFrame)lastFrame=time;
  var elapsed=Math.min((time-lastFrame)/1000,0.05);
  lastFrame=time;
  var dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
  var dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  if(dx||dy){
   var length=Math.sqrt(dx*dx+dy*dy);
   var distance=260*elapsed/length;
   setPosition(x+dx*distance,y+dy*distance);
   frame=requestAnimationFrame(animateMovement);
  }else lastFrame=0;
 }
 function startMovement(){
  if(!frame)frame=requestAnimationFrame(animateMovement);
 }
 function onKeyDown(e){
  if(done)return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowLeft'){
   e.preventDefault();keys[e.key]=true;startMovement();
  }else if(e.key==='Enter'||e.key===' '){
   var hit=hitAnswer(x+19,y+19);
   if(hit>=0){e.preventDefault();choose(hit)}
  }
 }
 function onKeyUp(e){
  if(Object.prototype.hasOwnProperty.call(keys,e.key)){
   keys[e.key]=false;
   if(!keys.ArrowDown&&!keys.ArrowRight&&!keys.ArrowUp&&!keys.ArrowLeft)stopMovement();
  }
 }
 function onWindowBlur(){stopMovement()}
 function choose(k){
  if(done)return;done=true;stopMovement();m.remove();
  window.removeEventListener('keydown',onKeyDown);
  window.removeEventListener('keyup',onKeyUp);
  window.removeEventListener('blur',onWindowBlur);
  var o=Q.o[k];bs.forEach(function(x){x.disabled=true});
  bs[k].classList.add(o.ok?'good':'bad');if(o.ok)score++;
  p.appendChild(el('div','msg',o.c));
  var n=el('button','main',i<QS.length-1?"Siguiente":"Ver la sorpresa");
  n.onclick=function(){i++;i<QS.length?ask():envelope()};
  p.appendChild(n);n.focus();
 }
 Q.o.forEach(function(o,k){var b=el('button','opt',o.t);b.onclick=function(){choose(k)};box.appendChild(b);bs.push(b)});
 home();
 function move(e){setPosition(e.clientX-19,e.clientY-19)}
 m.onpointerdown=function(e){if(done)return;e.preventDefault();m.setPointerCapture(e.pointerId);drag=true;m.classList.add('drag');move(e)};
 m.onpointermove=function(e){if(drag)move(e)};
 m.onpointerup=function(e){
  if(!drag)return;drag=false;m.classList.remove('drag');
  var hit=hitAnswer(e.clientX,e.clientY);
  if(hit>=0)choose(hit);
 };
 m.onpointercancel=function(){drag=false;m.classList.remove('drag')};
 window.addEventListener('keydown',onKeyDown);
 window.addEventListener('keyup',onKeyUp);
 window.addEventListener('blur',onWindowBlur);
 m.focus({preventScroll:true});
}
function envelope(){
 p.replaceChildren();
 p.appendChild(el('h2',null,"Terminaste: "+score+" de "+QS.length));
 p.appendChild(el('p',null,"Y la verdad es que da lo mismo, porque hay una sorpresa esperándote."));
 var surpriseImage=el('img','surprise-image');
 surpriseImage.src='post-cuestionario-gato.gif';
 surpriseImage.alt='Un gatito sorprendido.';
 p.appendChild(surpriseImage);
 var b=el('button','main',"Abrir la carta");b.onclick=letter;p.appendChild(b);
}
function letter(){
 p.replaceChildren();
 p.appendChild(el('h2',null,"Feliz primer mes"));
 var poemLayout=el('div','poem-layout');
 poemLayout.appendChild(el('div','letter',LETTER));
 var poemGif=el('img','poem-gif');
 poemGif.src='poema-gatito-lateral.gif';
 poemGif.alt='Un gatito blanco bailando.';
 poemLayout.appendChild(poemGif);
 p.appendChild(poemLayout);
 var poemImage=el('img','poem-image');
 poemImage.src='poema-gatito.jpg';
 poemImage.alt='Un gatito sostiene una rosa roja.';
 p.appendChild(poemImage);
 for(var k=0;k<14;k++){(function(k){setTimeout(function(){
  var h=el('div','heart',k%2?"💗":"🌸");h.style.left=(Math.random()*92)+"vw";
  document.body.appendChild(h);setTimeout(function(){h.remove()},5200)},k*220)})(k)}
}
function pad(n){return (n<10?'0':'')+n}
function lock(){
 cEl.classList.add('hide');p.replaceChildren();
 p.appendChild(coverImage());
 p.appendChild(el('div','gift-icon',"🎁")).setAttribute('aria-hidden','true');
 p.appendChild(el('h1',null,"Aún no es tiempo"));
 p.appendChild(el('p',null,"Este regalo se abrirá el 29 de octubre a las 00:00. Vuelve cuando llegue el día."));
 var c=el('p','msg');p.appendChild(c);var id;
 function tick(){
  var ms=START-new Date();
  if(ms<=0){clearInterval(id);cEl.classList.remove('hide');intro();return}
  var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  c.textContent="Faltan "+d+(d===1?" día, ":" días, ")+pad(h)+":"+pad(m)+":"+pad(s%60);
 }
 id=setInterval(tick,1000);tick();
}
var preview=location.hash==='#preview';
if(!preview&&new Date()<START)lock();else intro();
</script>
</body>
</html>
